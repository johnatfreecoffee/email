name: Deploy to Cloudflare Pages

# Forked from Mission Control's deploy workflow.
# Before this runs, create a Cloudflare Pages project named `email-app`
# (or change --project-name below) and add these GitHub repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   NEXT_PUBLIC_MC_API_SECRET, NEXT_PUBLIC_VAPID_PUBLIC_KEY,
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Server-side secrets (SUPABASE_SERVICE_KEY, RESEND_API_KEY, VAPID_PRIVATE_KEY,
# MC_API_SECRET, OPENROUTER_KEY, CLOUDFLARE_API_TOKEN) go in the Cloudflare
# Pages project's env vars — NOT here (they're needed at Functions runtime).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          # MC gotcha: static export needs the linux platform binaries explicitly.
          npm install --no-save lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MC_API_SECRET: ${{ secrets.NEXT_PUBLIC_MC_API_SECRET }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy out --project-name=email-app --commit-dirty=true
        env:
          CLOUDFLARE_API_RETRIES: "3"

      - name: Retry deploy on failure
        if: failure()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy out --project-name=email-app --commit-dirty=true
        env:
          CLOUDFLARE_API_RETRIES: "3"
